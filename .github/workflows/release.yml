name: Release

# Every push to master produces a release tagged v<version>-<run number>
# with a macOS DMG, a Windows zip and a Linux AppImage attached.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-latest }
          # Oldest supported distribution: the AppImage runs on anything newer.
          - { name: Linux,   os: ubuntu-22.04 }
          - { name: Windows, os: windows-latest }

    steps:
      - uses: actions/checkout@v5

      # See build.yml: the aqt Qt for macOS links the removed AGL framework.
      - name: Install Qt (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install qt ninja
          echo "QT_ROOT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Install Qt
        if: runner.os != 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libfuse2 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libegl1

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          packaging/macos.sh build/ci/bsc.app dist/bsc-macos.dmg

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          packaging/linux.sh build/ci dist/bsc-linux-x86_64.AppImage

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/bsc | Out-Null
          Copy-Item build/ci/bsc.exe dist/bsc/
          windeployqt --release --no-translations --no-opengl-sw dist/bsc/bsc.exe
          Compress-Archive -Path dist/bsc -DestinationPath dist/bsc-windows-x64.zip
          Remove-Item -Recurse -Force dist/bsc

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release metadata
        id: meta
        run: |
          version=$(grep -oP 'project\(bsc VERSION \K[0-9.]+' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: bsc ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build of ${{ github.sha }}.

            ${{ github.event.head_commit.message }}

            Packages are unsigned: on macOS right-click the app and choose Open
            the first time (or `xattr -d com.apple.quarantine bsc.app`); on
            Windows choose "More info / Run anyway" in SmartScreen; on Linux
            `chmod +x` the AppImage.
          files: dist/*
