name: Build

on:
  push:
    branches-ignore: [master]   # master is built and packaged by release.yml
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }
          - { name: Windows, os: windows-latest }

    steps:
      - uses: actions/checkout@v5

      # The aqt-packaged Qt 6.8 for macOS still links the AGL framework,
      # which Xcode 26 no longer ships, so macOS uses Homebrew's Qt (built
      # against the current SDK, the same setup BUILDING.md describes).
      - name: Install Qt (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install qt ninja
          echo "QT_ROOT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Install Qt
        if: runner.os != 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon0 libfontconfig1

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      # Starts the app with the offscreen platform plugin; it must still be
      # running when the timeout fires (exit 124), i.e. no crash on start.
      - name: Smoke run
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 5 build/ci/bsc
          rc=$?
          set -e
          test "$rc" -eq 124 || { echo "bsc exited with $rc"; exit 1; }
